services:
  - type: web
    name: gkgs-quiz
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/session
    disk:
      name: gkgs-quiz-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/gkgs.sqlite
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: BACKUPS_DIR
        value: /var/data/backups
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
